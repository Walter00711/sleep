<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sleep Check</title>

<style>
    body {
        font-family: Arial, sans-serif;
        background: #f4f4f4;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
    }

    .card {
        background: white;
        padding: 40px;
        border-radius: 15px;
        text-align: center;
        box-shadow: 0 10px 25px rgba(0,0,0,0.15);
        width: 350px;
    }

    h1 {
        margin-bottom: 30px;
    }

    button {
        display: block;
        width: 100%;
        margin: 10px 0;
        padding: 15px;
        font-size: 18px;
        border: none;
        border-radius: 10px;
        cursor: pointer;
        transition: 0.2s;
    }

    button:hover {
        transform: scale(1.03);
    }

    .good { background: #4CAF50; color: white; }
    .bad { background: #e67e22; color: white; }
    .off { background: #e74c3c; color: white; }

    #response {
        margin-top: 25px;
        font-size: 22px;
        font-weight: bold;
    }
</style>
</head>

<body>

<div class="card">
    <h1>How did you sleep?</h1>

    <button class="good" onclick="answer('good')">😊 Good</button>
    <button class="bad" onclick="answer('bad')">😴 Bad</button>
    <button class="off" onclick="answer('off')">🖕 Fuck Off</button>

    <div id="response"></div>
</div>

<script>
function answer(choice) {
    const response = document.getElementById("response");

    if (choice === "good") {
        response.textContent = "I am jealous 😒";
    } else if (choice === "bad") {
        response.textContent = "😢";
    } else {
        response.textContent = "You too <3";
    }
}
</script>

</body>
</html>
