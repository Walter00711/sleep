<script>
function answer(choice) {

    let message = "";

    if (choice === "good") {
        message = "I am jealous 😒";
    } else if (choice === "bad") {
        message = "😢";
    } else {
        message = "You too <3";
    }

    document.body.innerHTML = `
        <div style="
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
            background:#f4f4f4;
            font-family:Arial,sans-serif;
        ">
            <h1 style="
                font-size:50px;
                text-align:center;
            ">
                ${message}
            </h1>
        </div>
    `;
}
</script>
</html>
